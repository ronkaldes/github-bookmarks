const q=document.getElementById('q'),lang=document.getElementById('lang'),sort=document.getElementById('sort'),grid=document.getElementById('grid'),cnt=document.getElementById('count'),more=document.getElementById('more');
const langs={};D.forEach(r=>langs[r[2]]=(langs[r[2]]||0)+1);
lang.innerHTML='<option value="">All languages</option>'+Object.entries(langs).sort((a,b)=>b[1]-a[1]).map(([l,c])=>`<option value="${l}">${l} (${c})</option>`).join('');
let shown=60,list=[];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':n;
function run(){const t=q.value.toLowerCase();
list=D.filter(r=>(!lang.value||r[2]===lang.value)&&(!t||(r[0]+' '+r[1]).toLowerCase().includes(t)));
list.sort(sort.value==='n'?(a,b)=>a[0].localeCompare(b[0]):(a,b)=>b[3]-a[3]);render()}
function render(){const v=list.slice(0,shown);
grid.innerHTML=v.map(r=>`<a class="item" href="https://github.com/${r[0]}" target="_blank" rel="noopener"><span class="name">${esc(r[0])}</span><span class="desc">${esc(r[1]||'No description')}</span><span class="meta"><span class="chip">${esc(r[2])}</span>★ ${fmt(r[3])}</span></a>`).join('');
cnt.textContent=`Showing ${v.length} of ${list.length}`;more.hidden=v.length>=list.length}
[q,lang,sort].forEach(e=>e.addEventListener('input',()=>{shown=60;run()}));
more.onclick=()=>{shown+=120;render()};
run();
</script>
